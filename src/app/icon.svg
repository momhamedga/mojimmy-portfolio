<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    أيقونة الموقع — نفس علامة الشعار في الواجهة: مربّع بحواف دائرية
    بتدرّج العلامة (أزرق primary إلى أحمر accent) وحرف M.
    لم يُعَد تصميم العلامة، فقط نُقلت إلى أصل ثابت.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#297cef" />
      <stop offset="100%" stop-color="#db2943" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#000103" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#brand)" stroke-width="3" />
  <text
    x="32"
    y="33"
    fill="url(#brand)"
    font-family="Cairo, 'Segoe UI', Tahoma, Arial, sans-serif"
    font-size="38"
    font-weight="900"
    text-anchor="middle"
    dominant-baseline="central"
  >M</text>
</svg>
