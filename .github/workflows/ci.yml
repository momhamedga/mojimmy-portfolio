name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_smoke:
        description: "Run the read-only production smoke (Chromium + WebKit)"
        type: boolean
        default: false
      generate_visual_baselines:
        description: "Generate Linux visual baselines and check repeatability (artifact only)"
        type: boolean
        default: false
      calibrate_visual_threshold:
        description: "Calibrate the visual threshold across three independent Ubuntu runners"
        type: boolean
        default: false

# القراءة تكفي: لا وظيفة هنا تكتب في المستودع.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # البناء أولًا لا تجميلًا في الترتيب.
      #
      # `next-env.d.ts` يولّده Next وهو متجاهَل في git، وفيه مرجع
      # `next/image-types/global` الذي تُشتقّ منه أنواع استيراد الصور. بلا
      # بناء سابق يسقط `tsc` على استيرادات ‎.webp‎ الخمسة في previews.ts —
      # وهو بالضبط ما فشل به أول تشغيل لهذا الملف. محليًا لا يظهر العطب لأن
      # الملف مولَّد من قبل.
      - run: npm run build
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit

  e2e-chromium:
    name: E2E Chromium (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # استبعاد @provider صريح لا ضمني: هو الاختبار الوحيد الذي يبلغ مزوّد
      # البريد، وميزانيته اُستهلكت محليًا. الخادم يعمل بمفتاح غير صالح عمدًا
      # (يضبطه playwright.config.ts) فلا إرسال ممكن أصلًا — طبقتا حماية.
      - name: Run provider-free suite
        run: npx playwright test --project=chromium --grep-invert "@provider"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-firefox:
    name: E2E Firefox smoke (local)
    runs-on: ubuntu-latest
    # توافق المحرّكات لا يلزم كل طلب دمج — يكفي عند الدخول إلى main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test --project=firefox-smoke --workers=2

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firefox-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  generate-visual-baselines:
    name: Generate Linux visual baselines (manual)
    runs-on: ubuntu-latest
    # يدويًا فقط، ولا يفرض شيئًا.
    #
    # هذه الوظيفة تُنتج المراجع ولا تحرسها: لا تعمل على طلبات الدمج ولا عند
    # الدفع إلى main، ولا تكتب في المستودع (الأذونات قراءة فقط). المراجع
    # تنزل كأثر، تُراجَع بعين بشرية، ثم تُلتزم في التزام منفصل. حراسة
    # الانحدار البصري في CI ليست جزءًا من هذه المرحلة.
    if: github.event_name == 'workflow_dispatch' && inputs.generate_visual_baselines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # التوليد بعامل واحد: التوازي متغيّر لا داعي له وقت صنع المرجع نفسه.
      - name: Generate baselines
        run: npx playwright test --project=visual --update-snapshots --workers=1

      # تكرارية المرجع على لينكس — الحكم الفصل.
      #
      # القياس على ويندوز أظهر أن لقطة القائمة الزجاجية تنزاح ٨–٢٧ بكسل بين
      # تشغيل وآخر (ترقيم `backdrop-filter`). ويندوز لا سلطة له، فالسؤال
      # الحقيقي هو: هل يتكرّر ذلك هنا؟ هذه الخطوات تجيب بالقياس لا بالتخمين.
      # `continue-on-error` مقصود: الفشل هنا معلومة تُراجَع، لا سبب لإسقاط
      # الوظيفة قبل رفع الأثر.
      - name: Repeatability 1/3
        continue-on-error: true
        run: npx playwright test --project=visual --workers=1
      - name: Repeatability 2/3
        continue-on-error: true
        run: npx playwright test --project=visual --workers=1
      - name: Repeatability 3/3 (parallel, as enforcement would run)
        continue-on-error: true
        run: npx playwright test --project=visual

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: |
            tests/e2e/visual.spec.ts-snapshots/
            playwright-report/
            test-results/
          retention-days: 7

  visual-candidate:
    name: Visual candidate baselines (calibration)
    runs-on: ubuntu-latest
    # يدويًا فقط — لا يعمل على طلبات الدمج ولا عند الدفع.
    if: github.event_name == 'workflow_dispatch' && inputs.calibrate_visual_threshold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Environment authority
        run: |
          echo "runner=$RUNNER_NAME os=$ImageOS image=$ImageVersion"
          npx playwright --version
          node -p "require('@playwright/test/package.json').version"

      # مرجّح واحد فقط، تُقارن به المُشغِّلات الثلاثة جميعًا.
      - name: Generate candidate baselines
        run: npx playwright test --project=visual --update-snapshots --workers=1

      - uses: actions/upload-artifact@v4
        with:
          name: visual-candidate
          path: tests/e2e/visual.spec.ts-snapshots/
          retention-days: 7

  visual-crossrunner:
    name: Cross-runner threshold sweep ${{ matrix.runner }}
    needs: visual-candidate
    runs-on: ubuntu-latest
    # ثلاث وظائف متوازية = ثلاثة مُشغِّلات مستقلة، لا ثلاث إعادات على جهاز واحد.
    strategy:
      fail-fast: false
      matrix:
        runner: [B, C, D]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Runner identity
        run: echo "runner=$RUNNER_NAME os=$ImageOS image=$ImageVersion"

      # المرجع الوحيد يُنزَّل كما هو — لا يولّد أي مُشغِّل مرجعه الخاص،
      # وإلا قِسنا تكرارية الجهاز الواحد بدل الفروق بين الأجهزة.
      - uses: actions/download-artifact@v4
        with:
          name: visual-candidate
          path: tests/e2e/visual.spec.ts-snapshots/

      - name: Confirm candidate baselines in place
        run: |
          count=$(ls tests/e2e/visual.spec.ts-snapshots/*.png | wc -l)
          echo "goldens present: $count"
          test "$count" -eq 18
          sha256sum tests/e2e/visual.spec.ts-snapshots/*.png | sort -k2 | head -20

      # مسح تصاعدي بلا --update-snapshots: كل خطوة عتبة مرشّحة واحدة.
      # continue-on-error مقصود — الفشل هنا قياس لا عطب.
      - name: threshold 0
        continue-on-error: true
        env: { PW_VISUAL_THRESHOLD: "0" }
        run: npx playwright test --project=visual --workers=1
      - name: threshold 0.005
        continue-on-error: true
        env: { PW_VISUAL_THRESHOLD: "0.005" }
        run: npx playwright test --project=visual --workers=1
      - name: threshold 0.01
        continue-on-error: true
        env: { PW_VISUAL_THRESHOLD: "0.01" }
        run: npx playwright test --project=visual --workers=1
      - name: threshold 0.015
        continue-on-error: true
        env: { PW_VISUAL_THRESHOLD: "0.015" }
        run: npx playwright test --project=visual --workers=1
      - name: threshold 0.02
        continue-on-error: true
        env: { PW_VISUAL_THRESHOLD: "0.02" }
        run: npx playwright test --project=visual --workers=1
      - name: threshold 0.025
        continue-on-error: true
        env: { PW_VISUAL_THRESHOLD: "0.025" }
        run: npx playwright test --project=visual --workers=1
      - name: threshold 0.03
        continue-on-error: true
        env: { PW_VISUAL_THRESHOLD: "0.03" }
        run: npx playwright test --project=visual --workers=1

      # الشهادة النهائية: بلا تجاوز بيئي إطلاقًا، أي بالعتبة الملتزمة في
      # الإعداد نفسه. هذه الخطوة وحدها ليست continue-on-error — فشلها يجب أن
      # يُسقط الوظيفة لأنه يعني أن الإعداد المعتمد لا يصمد عبر المُشغِّلات.
      - name: FINAL — committed config (no override)
        run: npx playwright test --project=visual --workers=1

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-sweep-${{ matrix.runner }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-smoke:
    name: Production smoke (read-only, manual)
    runs-on: ubuntu-latest
    # يدويًا فقط.
    #
    # النشر على Vercel يبدأ مع الدفع ولا ينتهي بترتيب مضمون قبل تشغيل
    # GitHub Actions، فربط الفحص بالدفع يسابق النشر ويعطي نتائج كاذبة.
    # التشغيل اليدوي يجعل المشغِّل هو من يقرّر أن النشر اكتمل.
    if: github.event_name == 'workflow_dispatch' && inputs.production_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # WebKit يُنزَّل هنا وحده — لا في الوظائف الأخرى
      - run: npx playwright install --with-deps chromium webkit

      # قراءة فقط: الاختبارات نفسها تؤكّد صفر طلبات كتابة وصفر نداءات مزوّد.
      # لا أسرار مطلوبة — الموقع عام على HTTPS.
      - run: npx playwright test --project=chromium-production-smoke --workers=1
      - run: npx playwright test --project=webkit-production-smoke --workers=1

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
