name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_smoke:
        description: "Run the read-only production smoke (Chromium + WebKit)"
        type: boolean
        default: false
      certify_visual_baselines:
        description: "Generate Linux visual baselines and certify them on 5 independent runners"
        type: boolean
        default: false

# القراءة تكفي: لا وظيفة هنا تكتب في المستودع.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # البناء أولًا لا تجميلًا في الترتيب.
      #
      # `next-env.d.ts` يولّده Next وهو متجاهَل في git، وفيه مرجع
      # `next/image-types/global` الذي تُشتقّ منه أنواع استيراد الصور. بلا
      # بناء سابق يسقط `tsc` على استيرادات ‎.webp‎ الخمسة في previews.ts —
      # وهو بالضبط ما فشل به أول تشغيل لهذا الملف. محليًا لا يظهر العطب لأن
      # الملف مولَّد من قبل.
      - run: npm run build
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit

  e2e-chromium:
    name: E2E Chromium (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # استبعاد @provider صريح لا ضمني: هو الاختبار الوحيد الذي يبلغ مزوّد
      # البريد، وميزانيته اُستهلكت محليًا. الخادم يعمل بمفتاح غير صالح عمدًا
      # (يضبطه playwright.config.ts) فلا إرسال ممكن أصلًا — طبقتا حماية.
      - name: Run provider-free suite
        run: npx playwright test --project=chromium --grep-invert "@provider"

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-firefox:
    name: E2E Firefox smoke (local)
    runs-on: ubuntu-latest
    # توافق المحرّكات لا يلزم كل طلب دمج — يكفي عند الدخول إلى main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test --project=firefox-smoke --workers=2

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-firefox-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual-candidate:
    name: Visual candidate baselines
    runs-on: ubuntu-latest
    # يدويًا فقط — لا يعمل على طلبات الدمج ولا عند الدفع.
    if: github.event_name == 'workflow_dispatch' && inputs.certify_visual_baselines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Environment authority
        run: |
          echo "runner=$RUNNER_NAME os=$ImageOS image=$ImageVersion"
          npx playwright --version
          node -p "require('@playwright/test/package.json').version"

      # مرجع واحد فقط، تُقارن به كل مُشغِّلات الشهادة.
      - name: Generate candidate baselines
        run: npx playwright test --project=visual --update-snapshots --workers=1

      - name: Manifest
        run: |
          cd tests/e2e/visual.spec.ts-snapshots
          ls *.png | wc -l
          sha256sum *.png | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: visual-candidate
          path: tests/e2e/visual.spec.ts-snapshots/
          retention-days: 7

  visual-certify:
    name: Certify baselines ${{ matrix.runner }}
    needs: visual-candidate
    runs-on: ubuntu-latest
    # خمسة مُشغِّلات مستقلة لا ثلاثة: البكسل الشارد عشوائي ولم يظهر على كل
    # مُشغِّل في 5B.3، فالعيّنة الأوسع هي ما يجعل الشهادة ذات معنى.
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Runner identity
        run: |
          echo "runner=$RUNNER_NAME os=$ImageOS image=$ImageVersion"
          node -p "require('@playwright/test/package.json').version"

      # المرجع الوحيد يُنزَّل كما هو — لا مُشغِّل يولّد مرجعه الخاص، وإلا
      # قِسنا تكرارية الجهاز بدل الفروق بين الأجهزة.
      - uses: actions/download-artifact@v4
        with:
          name: visual-candidate
          path: tests/e2e/visual.spec.ts-snapshots/

      - name: Verify candidate integrity
        run: |
          cd tests/e2e/visual.spec.ts-snapshots
          test "$(ls *.png | wc -l)" -eq 18
          sha256sum -c SHA256SUMS.txt
          rm SHA256SUMS.txt

      # بلا --update-snapshots وبلا إعادة محاولة: السياسة الملتزمة نفسها.
      - name: Certify (strict, committed policy)
        run: npx playwright test --project=visual --workers=1

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-certify-${{ matrix.runner }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-smoke:
    name: Production smoke (read-only, manual)
    runs-on: ubuntu-latest
    # يدويًا فقط.
    #
    # النشر على Vercel يبدأ مع الدفع ولا ينتهي بترتيب مضمون قبل تشغيل
    # GitHub Actions، فربط الفحص بالدفع يسابق النشر ويعطي نتائج كاذبة.
    # التشغيل اليدوي يجعل المشغِّل هو من يقرّر أن النشر اكتمل.
    if: github.event_name == 'workflow_dispatch' && inputs.production_smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # WebKit يُنزَّل هنا وحده — لا في الوظائف الأخرى
      - run: npx playwright install --with-deps chromium webkit

      # قراءة فقط: الاختبارات نفسها تؤكّد صفر طلبات كتابة وصفر نداءات مزوّد.
      # لا أسرار مطلوبة — الموقع عام على HTTPS.
      - run: npx playwright test --project=chromium-production-smoke --workers=1
      - run: npx playwright test --project=webkit-production-smoke --workers=1

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
